[package]
name = "kalam-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
glam = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extras"] }
hecs = "0.10.5"
toml = { version = "0.9.6", default-features = false, features = ["parse", "serde", "std"] }
