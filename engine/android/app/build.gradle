plugins {
    id 'com.android.application'
}

// tool.py supplies absolute paths so Java sources and the SDL C library always match.
def sdl = file(providers.gradleProperty("kalamSdl").get())
def rust = file(providers.gradleProperty("kalamRustLib").get())
def engine = rootProject.file("..")
android {
    namespace 'org.kalam.renderer'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'org.kalam.renderer'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments "-DFETCHCONTENT_SOURCE_DIR_SDL3=${sdl.absolutePath}",
                          "-DKALAM_RUST_LIB=${rust.absolutePath}",
                          '-DANDROID_STL=c++_static',
                          '-DSDL_SHARED=ON', '-DSDL_STATIC=OFF'
                targets 'main', 'SDL3-shared'
            }
        }
    }
    sourceSets.main {
        java.srcDir new File(sdl, 'android-project/app/src/main/java')
        assets.srcDirs = [new File(engine, 'assets'), new File(engine, 'build/assets')]
    }
    externalNativeBuild {
        cmake {
            path new File(engine, 'native/CMakeLists.txt')
            version '3.31.6'
        }
    }
    // SDLActivity resolves SDL_main via applicationInfo.nativeLibraryDir/libmain.so.
    packaging.jniLibs.useLegacyPackaging = true
}
