name: Rust checks
on: [push, pull_request]

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p kalam-runtime -p kalam-ricochet
      - if: runner.os == 'Windows'
        run: cargo check --locked -p ricochet --features editor
